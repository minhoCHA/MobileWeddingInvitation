<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll SVG Demo</title>
  <style>
    :root {
      --line-color: #333;
      --bg: #f8f4ee;
      --text: #2c2623;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(201, 162, 162, 0.25), transparent 45%),
        radial-gradient(circle at 85% 78%, rgba(168, 181, 156, 0.25), transparent 48%),
        var(--bg);
    }

    .scroll-scene {
      position: relative;
      height: 300vh;
      padding-top: 24vh;
    }

    .sticky-stage {
      position: sticky;
      top: 8vh;
      width: min(92vw, 560px);
      margin: 0 auto;
      aspect-ratio: 7 / 10;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: 0 14px 42px rgba(20, 20, 20, 0.14);
      border: 1px solid rgba(51, 51, 51, 0.08);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .scene-title {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 14px;
      letter-spacing: 0.06em;
      color: rgba(44, 38, 35, 0.78);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    #groom-path, #bride-path {
      transition: stroke-dashoffset 20ms ease-in-out;
      fill: none;
      stroke: #333;
      stroke-width: 4;
    }

    #groom-path {
      stroke: #8b5a5a;
    }

    #bride-path {
      stroke: #5f7668;
    }

    .city-label {
      position: absolute;
      z-index: 2;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(44, 38, 35, 0.12);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.08);
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .l-seoul { left: 18%; top: 13%; }
    .l-sf { left: 31%; top: 28%; }
    .l-chicago { left: 79%; top: 13%; }
    .l-la { left: 50%; top: 49%; }
    .l-lv { left: 50%; top: 82%; }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(44, 38, 35, 0.7);
      z-index: 2;
    }
  </style>
</head>
<body>
  <main class="scroll-scene">
    <section class="sticky-stage" aria-label="Scroll linked path animation demo">
      <p class="scene-title">Scroll to draw the route</p>

      <span class="city-label l-seoul">Seoul</span>
      <span class="city-label l-sf">SF</span>
      <span class="city-label l-chicago">Chicago</span>
      <span class="city-label l-la">LA</span>
      <span class="city-label l-lv">Las Vegas</span>

      <svg viewBox="0 0 560 800" role="img" aria-label="Groom and bride routes converging at LA then heading to Las Vegas">
        <path id="groom-path" d="M100 110 C120 170, 150 210, 190 250 C230 290, 255 335, 280 390 C295 425, 300 455, 300 505 C300 560, 300 620, 300 705"/>
        <path id="bride-path" d="M450 110 C430 165, 410 215, 365 270 C330 315, 307 350, 280 390 C265 415, 260 450, 260 505 C260 560, 260 620, 260 705"/>
      </svg>

      <p class="hint">스크롤할수록 선이 그려집니다</p>
    </section>
  </main>

  <script src="https://www.unpkg.com/scroll-svg@1.5.2/dist/index.js" crossorigin="anonymous"></script>
  <script>
    const { default: scrollSvg } = window.$_scrollSvg || {};
    if (typeof scrollSvg === 'function') {
      scrollSvg(document.querySelector('#groom-path'));
      scrollSvg(document.querySelector('#bride-path'));
    }
  </script>
</body>
</html>
