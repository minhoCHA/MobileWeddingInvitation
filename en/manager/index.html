<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#FBF7F3">
  <title>RSVP Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="en-page">
  <main class="card" id="card">
    <div class="manager-panel" id="manager-panel" aria-live="polite">
      <div class="stats-panel" id="rsvp-stats"></div>
      <div class="manager-tabs" role="tablist" aria-label="RSVP response filter">
        <button class="manager-tab is-active" type="button" data-filter="all" role="tab" aria-selected="true">All list</button>
        <button class="manager-tab" type="button" data-filter="Attending" role="tab" aria-selected="false">Attending</button>
        <button class="manager-tab" type="button" data-filter="Not attending" role="tab" aria-selected="false">Not attending</button>
        <button class="manager-tab" type="button" data-filter="Not sure yet" role="tab" aria-selected="false">Not sure yet</button>
      </div>
      <ul class="manager-list" id="rsvp-manager-list"></ul>
    </div>
  </main>

  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

  <script src="/script.js?v=20260805-3"></script>
</body>
</html>
